apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# STAGING (exercise 4.9): every commit to the main branch is deployed here (the CI workflow
# the workflow gitops-staging.yaml of the code repository writes the new image tags below and commits them).
# Differences with production:
#   - the broadcaster only LOGS the messages, it does not send them to any external service
#   - the database is NOT backed up
namespace: staging

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.localhost
  target:
    kind: Ingress
    name: todo-app-ingress
- path: nats-subject.yaml
- path: broadcaster-log.yaml

images:
- name: wallas25/broadcaster
  newName: wallas25/broadcaster
  newTag: b48ad064f027f32909497c5eceb859159048cad0
- name: wallas25/todo-app
  newName: wallas25/todo-app
  newTag: b48ad064f027f32909497c5eceb859159048cad0
- name: wallas25/todo-backend
  newName: wallas25/todo-backend
  newTag: b48ad064f027f32909497c5eceb859159048cad0
- name: wallas25/todo-cronjob
  newName: wallas25/todo-cronjob
  newTag: b48ad064f027f32909497c5eceb859159048cad0
