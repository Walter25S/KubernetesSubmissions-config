apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PRODUCTION (exercise 4.9): a commit with a tag is deployed here (the CI workflow
# the workflow gitops-production.yaml of the code repository, started by the tag, writes the image tags below and commits them).
# Differences with staging:
#   - the broadcaster forwards the messages to the external chat service (the URL is in the Secret
#     "broadcaster-webhook", created by hand)
#   - the database IS backed up every day (../../base/backup-local)
namespace: production

resources:
- ../../base
- ../../base/backup-local

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: production.localhost
  target:
    kind: Ingress
    name: todo-app-ingress
- path: nats-subject.yaml

images:
- name: wallas25/broadcaster
  newName: wallas25/broadcaster
  newTag: v1.0.0
- name: wallas25/todo-app
  newName: wallas25/todo-app
  newTag: v1.0.0
- name: wallas25/todo-backend
  newName: wallas25/todo-backend
  newTag: v1.0.0
- name: wallas25/todo-cronjob
  newName: wallas25/todo-cronjob
  newTag: v1.0.0
